server:
  host: 0.0.0.0
  port: 8765
  data_dir: ./data
  # ROI gate: split the incoming frame into a 4x4 grid; only call the VLM
  # when at least one cell changed by >= roi_threshold bits of phash.
  # Filters out mouse hover, animations, chat scrolling, etc.
  roi_grid: 4
  roi_threshold: 4

capture:
  # Linux box's IP from the Windows box's perspective.
  server_url: http://192.168.1.100:8765/frame
  fps: 1.0
  phash_threshold: 5
  monitor: 1

llm:
  base_url: http://localhost:11434
  # Local default. Alternatives: qwen2.5vl:32b (higher accuracy, ~24GB VRAM),
  # llama3.2-vision:11b, minicpm-v.
  model: qwen2.5vl:7b
  temperature: 0.1
  num_ctx: 8192

scryfall:
  cache_dir: ./data/scryfall
