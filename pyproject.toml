[project]
name = "analyst"
version = "0.1.0"
description = "Local screen reader for MTGO game state tracking"
requires-python = ">=3.11"
dependencies = [
    "mss>=9.0",
    "pillow>=10.0",
    "imagehash>=4.3",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pytesseract>=0.3.10",
    "click>=8.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
analyst = "analyst.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyst"]
